  <path d="M0 300 Q200 220 400 290 T800 270 V500 H0 Z" fill="#34d399" opacity="0.5"/>
  <path d="M0 340 Q250 270 500 330 T800 320 V500 H0 Z" fill="#10b981" opacity="0.55"/>
